# Dataset Configuration
data:
  dataset_name: "FaceForensics++ & Celeb-DF Mixed Training"
  dataset_path: "data_processed/"
  frame_size: [224, 224]
  num_frames: 8

# Model Configuration
model:
  spatial:
    backbone: "resnet50"
    pretrained: true
    num_classes: 2
    feature_dim: 512

  frequency:
    backbone: "efficientnet_b0"
    pretrained: true
    num_classes: 2
    feature_dim: 256

  spatiotemporal:
    cnn_backbone: "resnet50"
    lstm_hidden_size: 512
    lstm_num_layers: 2
    dropout: 0.3
    bidirectional: true

  ensemble:
    fusion_method: "concatenate"
    classifier_hidden: 256

# Training Configuration
training:
  batch_size: 4
  num_frames: 8
  num_epochs: 100 # INCREASED
  learning_rate: 0.00003 # REVERTED
  optimizer: "adamw"
  scheduler: "cosine"
  weight_decay: 0.001
  mixup_alpha: 1.0
  grad_clip: 1.0
  early_stopping_patience: 25 # INCREASED
  mixed_precision: true
  device: "cuda"
  num_workers: 4
  pin_memory: true
  warmup_epochs: 3
  min_lr: 0.000001 # REVERTED

# Evaluation Configuration
evaluation:
  metrics:
    [
      "accuracy",
      "precision",
      "recall",
      "f1",
      "auc_roc",
      "auprc",
      "fpr_at_95_tpr",
    ]
  calibration: true
  save_confusion_matrix: true
  save_roc_curve: true
  threshold: 0.5

# Paths Configuration
paths:
  data_root: "data_processed/"
  model_checkpoints: "models/checkpoints/"
  trained_models: "models/trained/"
  pretrained_models: "models/pretrained/"
  logs: "logs/tensorboard/"
  results: "results/"

# Experiment Tracking
experiment:
  name: "truesight_900videos_mixed_training_fixed"
  seed: 42
  notes: "900 videos with warmup scheduler and proper threshold"

# Hardware Configuration
hardware:
  gpu_name: "RTX 4060 Laptop"
  gpu_memory: "8GB"
  use_cuda: true
  cuda_benchmark: true

# ✅ ADD THIS SECTION (MISSING!)
# Application Configuration (for API/Inference)
app:
  max_upload_size_mb: 500
  allowed_extensions: ["mp4", "avi", "mov"]
  inference_threshold: 0.3 # CRITICAL: Use 0.3, not 0.5
  batch_size: 1
  num_workers: 2
