# ============================================
# TrueSight Configuration File
# ============================================
# Last Updated: Nov 14, 2025
# Model Version: Run 4 (Epoch 12, 80.17% AUC)
# ============================================

# Dataset Configuration
data:
  dataset_name: "FaceForensics++ & Celeb-DF Mixed Training"
  dataset_path: "data_processed/"
  frame_size: [224, 224]
  num_frames: 8

# Model Configuration
model:
  spatial:
    backbone: "resnet50"
    pretrained: true
    num_classes: 2
    feature_dim: 512

  frequency:
    backbone: "efficientnet_b0"
    pretrained: true
    num_classes: 2
    feature_dim: 256

  spatiotemporal:
    cnn_backbone: "resnet50"
    lstm_hidden_size: 512
    lstm_num_layers: 2
    dropout: 0.3
    bidirectional: true

  ensemble:
    fusion_method: "concatenate"
    classifier_hidden: 256

# Training Configuration
training:
  batch_size: 4
  num_frames: 8
  num_epochs: 100
  learning_rate: 0.00003
  optimizer: "adamw"
  scheduler: "cosine"
  weight_decay: 0.001
  mixup_alpha: 1.0
  grad_clip: 1.0
  early_stopping_patience: 25
  mixed_precision: true
  device: "cuda"
  num_workers: 4
  pin_memory: true
  warmup_epochs: 3
  min_lr: 0.000001

# Evaluation Configuration
evaluation:
  metrics:
    [
      "accuracy",
      "precision",
      "recall",
      "f1",
      "auc_roc",
      "auprc",
      "fpr_at_95_tpr",
    ]
  calibration: true
  save_confusion_matrix: true
  save_roc_curve: true
  threshold: 0.5 # Model 4 uses 0.5 threshold

# Application Configuration (for API/Inference)
app:
  max_upload_size_mb: 500
  allowed_extensions: ["mp4", "avi", "mov"]
  inference_threshold: 0.5 # ✅ CHANGED: Match Model 4 training threshold (was 0.3)
  batch_size: 1
  num_workers: 2
  enable_gradcam: false

  # Model metadata (for documentation)
  model_version: "Run 4 (Epoch 12)"
  model_description: "Mixup 1.0 + Low LR - Balanced but Weak (80.17% AUC)"
  expected_performance:
    auc: 0.8017
    false_negatives: 172
    false_positives: 150
    status: "Stable - Awaiting architecture improvements"

# Paths Configuration
paths:
  data_root: "data_processed/"
  model_checkpoints: "models/checkpoints/"
  trained_models: "models/trained/"
  pretrained_models: "models/pretrained/"
  logs: "logs/tensorboard/"
  results: "results/"

# Experiment Tracking
experiment:
  name: "truesight_900videos_mixed_training_fixed"
  seed: 42
  notes: "900 videos with warmup scheduler and proper threshold"

# Hardware Configuration
hardware:
  gpu_name: "RTX 4060 Laptop"
  gpu_memory: "8GB"
  use_cuda: true
  cuda_benchmark: true
