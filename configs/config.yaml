# Dataset Configuration
data:
  dataset_name: "FaceForensics++"
  dataset_path: "data/splits/" 
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  frame_size: [224, 224]
  num_frames: 16


# Model Configuration
model:
  spatial:
    backbone: "resnet50"
    pretrained: true
    num_classes: 2
    feature_dim: 512
  frequency:
    backbone: "efficientnet_b0"
    pretrained: true
    num_classes: 2
    feature_dim: 256
  spatiotemporal:
    cnn_backbone: "resnet50"
    lstm_hidden_size: 512
    lstm_num_layers: 2
    dropout: 0.3
    bidirectional: true
  ensemble:
    fusion_method: "concatenate"
    classifier_hidden: 256

# Training Configuration
training:
  batch_size: 2          
  num_frames: 8           
  num_epochs: 50
  learning_rate: 0.0001
  optimizer: "adam"
  scheduler: "cosine"
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 10
  mixed_precision: true   
  device: "cuda"
  num_workers: 2          
  pin_memory: true

# Evaluation Configuration
evaluation:
  metrics: ["auc_roc", "auprc", "f1", "accuracy", "fpr_at_95_tpr"]
  calibration: true
  save_confusion_matrix: true

# Logging Configuration
logging:
  tensorboard_dir: "logs/tensorboard"
  checkpoint_dir: "models/checkpoints"
  log_interval: 10
  save_interval: 5

# Application Configuration
app:
  title: "TrueSight: Deepfake Detection"
  max_upload_size_mb: 500
  enable_gradcam: true

# Paths Configuration
paths:
  data_root: "data/splits/"  
  train_csv: "data/splits/train.csv"  
  val_csv: "data/splits/val.csv"  
  test_csv: "data/splits/test.csv"  
  
  model_checkpoints: "models/checkpoints/"
  trained_models: "models/trained/"
  logs: "logs/tensorboard/"
  results: "results/"

# Experiment tracking
experiment:
  name: "truesight_v1"
  seed: 42
