# Dataset Configuration
data:
  dataset_name: "FaceForensics++"
  dataset_path: "data/datasets/faceforensics"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  frame_size: [224, 224]
  num_frames: 32

# Model Configuration
model:
  spatial:
    backbone: "resnet50"
    pretrained: true
    num_classes: 2
  frequency:
    backbone: "efficientnet_b0"
    pretrained: true
    num_classes: 2
  spatiotemporal:
    cnn_backbone: "resnet50"
    lstm_hidden_size: 512
    lstm_num_layers: 2
    dropout: 0.3

# Training Configuration
training:
  batch_size: 16
  num_epochs: 50
  learning_rate: 0.0001
  optimizer: "adam"
  scheduler: "cosine"
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stopping_patience: 10
  mixed_precision: true

# Evaluation Configuration
evaluation:
  metrics: ["auc_roc", "auprc", "f1", "accuracy", "fpr_at_95_tpr"]
  calibration: true
  save_confusion_matrix: true

# Logging Configuration
logging:
  tensorboard_dir: "logs/tensorboard"
  checkpoint_dir: "models/checkpoints"
  log_interval: 10
  save_interval: 5

# Application Configuration
app:
  title: "TrueSight: Deepfake Detection"
  max_upload_size_mb: 500
  enable_gradcam: true
